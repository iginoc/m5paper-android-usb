[env:m5stack-paper]
platform = espressif32@6.7.0
board = m5stack-fire
framework = arduino
board_build.partitions = default_16MB.csv
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
lib_deps = 
	m5stack/M5EPD@^0.1.5
	ricmoo/QRCode@^0.0.1
board_build.m5stack_core_version = 0.0.0
upload_speed = 460800
monitor_speed = 2000000
monitor_rts = 0
monitor_dtr = 0